name: Check Nix

on:
  push:
    paths:
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/check_nix.yaml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31

      - name: Format check
        run: nix run nixpkgs#nixpkgs-fmt -- --check .

      - name: Lint with statix
        run: nix run nixpkgs#statix -- check .

      - name: Check flake
        run: nix flake check

  hosts:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31

      - name: List hosts from the flake
        id: list
        run: echo "list=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  build:
    name: dry-build (${{ matrix.host }})
    needs: hosts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.list) }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31

      - name: Dry-build system
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --dry-run
