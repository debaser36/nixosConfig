name: Check Nix

on:
  push:
    paths:
      - '**.nix'
      - 'flake.lock'
      - 'statix.toml'
      - '.github/workflows/check_nix.yaml'
  pull_request:
    paths:
      - '**.nix'
      - 'flake.lock'
      - 'statix.toml'
      - '.github/workflows/check_nix.yaml'
  workflow_dispatch:
  # Used by update_flake_lock.yaml: pull requests opened with GITHUB_TOKEN start no workflows themselves
  workflow_call:
    inputs:
      ref:
        description: Branch to check
        type: string
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Formatting and statix run as flake checks (pinned versions, see `checks` in flake.nix)
      - name: Check flake
        run: nix flake check

  hosts:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31

      - name: List hosts from the flake
        id: list
        run: echo "list=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  build:
    name: dry-build (${{ matrix.host }})
    needs: hosts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.list) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Dry-build system
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --dry-run
