name: Check Nix

on:
  push:
    paths:
      - '**.nix'
      - '**/flake.lock'
      - '.github/workflows/check_nix.yaml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31

      - name: Format check
        run: nix run nixpkgs#nixpkgs-fmt -- --check .

      - name: Lint with statix
        run: nix run nixpkgs#statix -- check .

  check:
    name: check (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: nixos-home
            config: nixos
          - host: nixos-work
            config: nixos
          - host: nixos-oracle
            config: nixos-oracle
          - host: nixos-asus-laptop
            config: nixos
          - host: thinkpadx1carbon
            config: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31

      - name: Check flake
        run: nix flake check ./hosts/${{ matrix.host }}

      - name: Dry-build system
        run: nix build ./hosts/${{ matrix.host }}#nixosConfigurations.${{ matrix.config }}.config.system.build.toplevel --dry-run
